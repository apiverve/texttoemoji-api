[project]
name = "apiverve-texttoemoji"
version = "1.2.2"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Text to Emoji converts plain text strings into matching emoji representations. Send any word or phrase and receive the corresponding emoji characters."
keywords = ["text to emoji api", "convert text to emoji", "translate text to emoji", "words to emoji", "emoji translator"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/texttoemoji?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/texttoemoji?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/texttoemoji-api"
Twitter = "https://twitter.com/apivervehq"
