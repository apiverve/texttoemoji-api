openapi: 3.0.4
info:
  title: Text to Emoji
  description: >-
    Text to Emoji converts plain text strings into matching emoji
    representations. Send any word or phrase and receive the corresponding emoji
    characters.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/texttoemoji:
    post:
      summary: Text to Emoji
      description: >-
        Text to Emoji is a simple tool for converting text into emojis. It
        returns the emojis that represent the given text.
      operationId: texttoemoji
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  emojis:
                    - 👈🏾
                    - ✨👏
                    - 🔥👏🏽
                    - 👊🏾💪🏾
                    - 🔥🤙🏼
                    - 🤌🏽🔥
                    - 🤩👏🏻
                    - 😁📚🙌
                    - 😞
                    - 👉🏽👈🏽
                  matchedEmojis:
                    - emoji: 👙
                      name: bikini
                      match: swim
                      relevance: 0.584
                    - emoji: 🛁
                      name: bathtub
                      match: lake
                      relevance: 0.51
                    - emoji: 🩱
                      name: one-piece swimsuit
                      match: null
                      relevance: 0.387
                    - emoji: 🏊️
                      name: person swimming
                      match: null
                      relevance: 0.37
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: The text you want converted into emojis
              required:
                - text
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
sampleRequest:
  text: I am so excited to go to the lake and swim
